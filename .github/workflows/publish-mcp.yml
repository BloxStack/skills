name: Publish BloxStack to the MCP Registry

on: workflow_dispatch

permissions: {}

concurrency: publish-bloxstack-mcp

jobs:
  publish:
    if: github.repository == 'BloxStack/skills' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Download the public manifest for this commit
        run: |
          curl --fail --silent --show-error --location --retry 2 \
            "https://raw.githubusercontent.com/BloxStack/skills/$GITHUB_SHA/server.json" \
            --output server.json

      - name: Verify and run the official MCP publisher
        env:
          PUBLISHER_VERSION: v1.8.16
          PUBLISHER_SHA256: 6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --silent --show-error --location --retry 2 \
            "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER_VERSION/$archive" \
            --output "$archive"
          printf '%s  %s\n' "$PUBLISHER_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" mcp-publisher
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
